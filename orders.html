<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-buy Admin | Orders</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    background: #09090b;
    color: #f4f4f5;
    font-family: Inter, system-ui, sans-serif;
}
.card {
    background: #111114;
    border: 1px solid #27272a;
}
select, input {
    background: #18181b;
    border: 1px solid #3f3f46;
    color: white;
}
.status {
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
}
.pending_review { background:#422006;color:#fbbf24; }
.under_investigation { background:#172554;color:#93c5fd; }
.awaiting_customer { background:#3b0764;color:#d8b4fe; }
.awaiting_payment { background:#431407;color:#fdba74; }
.procurement { background:#164e63;color:#67e8f9; }
.in_transit { background:#312e81;color:#c4b5fd; }
.completed { background:#052e16;color:#86efac; }
.cancelled, .unavailable { background:#3f3f46;color:#d4d4d8; }
</style>
</head>

<body>

<div class="min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 hidden md:flex flex-col border-r border-zinc-800 p-6">
    <h1 class="text-2xl font-bold mb-2">R-buy<span class="text-blue-500">.</span></h1>
    <p class="text-xs text-zinc-500 mb-10">ADMINISTRATION</p>

    <nav class="space-y-3 text-sm">
        <a href="index.html" class="block text-zinc-400 hover:text-white">Dashboard</a>
        <a href="orders.html" class="block text-blue-400 font-semibold">Orders</a>
        <a href="customers.html" class="block text-zinc-400 hover:text-white">Customers</a>
    </nav>

    <div class="mt-auto pt-8">
        <button onclick="logout()" class="text-sm text-red-400">Sign out</button>
    </div>
</aside>

<!-- MAIN -->
<main class="flex-1 p-5 md:p-10 overflow-x-auto">

    <header class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <div>
            <h2 class="text-3xl font-bold">Orders</h2>
            <p class="text-zinc-500 mt-2">Manage incoming customer requests.</p>
        </div>

        <div class="flex gap-3">
            <button onclick="loadOrders()"
                class="px-4 py-2 rounded-lg border border-zinc-700 hover:bg-zinc-800">
                ↻ Refresh
            </button>
            <button onclick="logout()"
                class="px-4 py-2 rounded-lg bg-red-950 text-red-300">
                Logout
            </button>
        </div>
    </header>

    <!-- SUMMARY -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="card rounded-xl p-5">
            <p class="text-zinc-500 text-sm">Total Orders</p>
            <h3 id="totalOrders" class="text-2xl font-bold mt-2">0</h3>
        </div>

        <div class="card rounded-xl p-5">
            <p class="text-zinc-500 text-sm">Pending Review</p>
            <h3 id="pendingOrders" class="text-2xl font-bold text-yellow-400 mt-2">0</h3>
        </div>

        <div class="card rounded-xl p-5">
            <p class="text-zinc-500 text-sm">In Progress</p>
            <h3 id="activeOrders" class="text-2xl font-bold text-blue-400 mt-2">0</h3>
        </div>

        <div class="card rounded-xl p-5">
            <p class="text-zinc-500 text-sm">Completed</p>
            <h3 id="completedOrders" class="text-2xl font-bold text-green-400 mt-2">0</h3>
        </div>
    </section>

    <!-- FILTERS -->
    <section class="card rounded-xl p-5 mb-6">
        <div class="grid md:grid-cols-3 gap-4">
            <input
                id="searchInput"
                type="text"
                placeholder="Search customer, product or reference..."
                class="rounded-lg px-4 py-3 w-full"
                oninput="renderOrders()">

            <select id="statusFilter"
                class="rounded-lg px-4 py-3 w-full"
                onchange="renderOrders()">
                <option value="">All statuses</option>
                <option value="pending_review">Pending review</option>
                <option value="under_investigation">Under investigation</option>
                <option value="awaiting_customer">Awaiting customer</option>
                <option value="awaiting_payment">Awaiting payment</option>
                <option value="procurement">Procurement</option>
                <option value="in_transit">In transit</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
                <option value="unavailable">Unavailable</option>
            </select>

            <button onclick="clearFilters()"
                class="rounded-lg border border-zinc-700 hover:bg-zinc-800 px-4 py-3">
                Clear filters
            </button>
        </div>
    </section>

    <!-- TABLE -->
    <section class="card rounded-xl overflow-hidden">
        <div class="p-5 border-b border-zinc-800 flex justify-between">
            <h3 class="font-semibold">Order records</h3>
            <span id="resultCount" class="text-sm text-zinc-500">0 orders</span>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm min-w-[900px]">
                <thead class="bg-zinc-900 text-zinc-500">
                    <tr>
                        <th class="p-4">Reference</th>
                        <th class="p-4">Customer</th>
                        <th class="p-4">Product</th>
                        <th class="p-4">Date</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Payment</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>

                <tbody id="ordersTable">
                    <tr>
                        <td colspan="7" class="p-8 text-center text-zinc-500">
                            Loading orders...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div id="message" class="mt-5 text-sm"></div>

</main>
</div>

<script>
const SUPABASE_URL = "https://ixuohpgqpuvjdbigmhje.supabase.co";
const SUPABASE_KEY = "sb_publishable_39FVpTmUPUsSqGAysBbP1A_xqF0nFaA";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let allOrders = [];

const statuses = {
    pending_review: "Pending Review",
    under_investigation: "Under Investigation",
    awaiting_customer: "Awaiting Customer",
    awaiting_payment: "Awaiting Payment",
    procurement: "Procurement",
    in_transit: "In Transit",
    completed: "Completed",
    cancelled: "Cancelled",
    unavailable: "Unavailable"
};

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function reference(id) {
    return "RBUY-" + String(id).replace(/-/g, "").slice(0, 8).toUpperCase();
}

function formatDate(date) {
    return new Date(date).toLocaleDateString("en-KE", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function formatStatus(status) {
    return statuses[status] || status;
}

function whatsappLink(phone) {
    const number = String(phone || "").replace(/\D/g, "");
    if (!number) return "";
    return "https://wa.me/" + number;
}

function showMessage(text, color = "text-zinc-400") {
    const el = document.getElementById("message");
    el.className = "mt-5 text-sm " + color;
    el.textContent = text;
}

// AUTHORIZATION
async function checkAdmin() {
    const { data: { session }, error } =
        await supabaseClient.auth.getSession();

    if (error || !session) {
        location.href = "login.html";
        return false;
    }

    const { data, error: adminError } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

    if (adminError || !data) {
        await supabaseClient.auth.signOut();
        location.href = "login.html";
        return false;
    }

    return true;
}

// LOAD ORDERS
async function loadOrders() {
    showMessage("Loading orders...");

    const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        showMessage("Could not load orders: " + error.message, "text-red-400");
        return;
    }

    allOrders = data || [];

    updateSummary();
    renderOrders();

    showMessage("Orders successfully synchronized.", "text-green-400");
}

function updateSummary() {
    document.getElementById("totalOrders").textContent = allOrders.length;

    document.getElementById("pendingOrders").textContent =
        allOrders.filter(o => o.status === "pending_review").length;

    document.getElementById("activeOrders").textContent =
        allOrders.filter(o => [
            "under_investigation",
            "awaiting_customer",
            "awaiting_payment",
            "procurement",
            "in_transit"
        ].includes(o.status)).length;

    document.getElementById("completedOrders").textContent =
        allOrders.filter(o => o.status === "completed").length;
}

// RENDER TABLE
function renderOrders() {
    const search = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const status = document.getElementById("statusFilter").value;

    const filtered = allOrders.filter(order => {
        const matchesStatus = !status || order.status === status;

        const ref = reference(order.id).toLowerCase();

        const matchesSearch = [
            order.customer_name,
            order.product_name,
            order.whatsapp,
            order.email,
            ref
        ].some(value => String(value || "").toLowerCase().includes(search));

        return matchesStatus && matchesSearch;
    });

    document.getElementById("resultCount").textContent =
        filtered.length + " orders";

    const table = document.getElementById("ordersTable");

    if (!filtered.length) {
        table.innerHTML = `
            <tr>
                <td colspan="7" class="p-10 text-center text-zinc-500">
                    No orders found.
                </td>
            </tr>`;
        return;
    }

    table.innerHTML = filtered.map(order => {
        const ref = reference(order.id);
        const phoneLink = whatsappLink(order.whatsapp);

        return `
        <tr class="border-t border-zinc-800 hover:bg-zinc-900/60">

            <td class="p-4">
                <a href="order-details.html?id=${encodeURIComponent(order.id)}"
                   class="font-semibold text-blue-400 hover:text-blue-300">
                   ${escapeHTML(ref)}
                </a>
            </td>

            <td class="p-4">
                <div class="font-medium">${escapeHTML(order.customer_name)}</div>
                <div class="text-xs text-zinc-500">${escapeHTML(order.whatsapp)}</div>
                ${order.email ? `<div class="text-xs text-zinc-500">${escapeHTML(order.email)}</div>` : ""}
            </td>

            <td class="p-4">${escapeHTML(order.product_name)}</td>

            <td class="p-4 text-zinc-400">${formatDate(order.created_at)}</td>

            <td class="p-4">
                <span class="status ${escapeHTML(order.status)}">
                    ${escapeHTML(formatStatus(order.status))}
                </span>
            </td>

            <td class="p-4">
                <span class="text-xs ${
                    order.payment_status === "paid" ? "text-green-400" :
                    order.payment_status === "pending" ? "text-yellow-400" :
                    "text-zinc-400"
                }">
                    ${escapeHTML(order.payment_status || "unpaid")}
                </span>
            </td>

            <td class="p-4">
                <div class="flex gap-3 items-center">
                    <a href="order-details.html?id=${encodeURIComponent(order.id)}"
                       class="text-blue-400 hover:text-blue-300">
                       View
                    </a>

                    ${phoneLink ? `
                    <a href="${escapeHTML(phoneLink)}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="text-green-400 hover:text-green-300">
                       WhatsApp
                    </a>` : ""}
                </div>
            </td>

        </tr>`;
    }).join("");
}

function clearFilters() {
    document.getElementById("searchInput").value = "";
    document.getElementById("statusFilter").value = "";
    renderOrders();
}

async function logout() {
    await supabaseClient.auth.signOut();
    location.href = "login.html";
}

// INITIALIZE
(async function init() {
    const authorized = await checkAdmin();
    if (!authorized) return;

    await loadOrders();
})();
</script>

</body>
</html>
